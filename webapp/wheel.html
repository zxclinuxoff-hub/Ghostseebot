<style>

function buildWheel(){const n=S.prizes.length,w=360/n,g=S.prizes.map((p,i)=>(p.code=='bear'||p.code=='d30'?'#40351d':i%2?'#1c1c28':'#262636')+' '+i*w+'deg '+(i+1)*w+'deg');
$('disc').style.setProperty('--w',w+'deg');$('disc').style.background='conic-gradient('+g.join(',')+')';
$('disc').innerHTML=S.prizes.map((p,i)=>'<div class="sec" style="transform:rotate('+(i+.5)*w+'deg);--a:'+(-(i+.5)*w)+'deg"><i>'+ic(p.code,40)+'</i><b>'+(SHORT[p.code]||esc(p.name))+'</b></div>').join('')}
function reelInit(){[0,1,2].forEach(i=>{$('r'+i).style.transition='none';$('r'+i).style.transform='translateY(0)';$('r'+i).innerHTML='<div>'+ic(cur[i],58)+'</div>'})}
function ui(){$('sh').textContent=S.shards;$('need').textContent=S.need;$('shb').style.width=S.shards/S.need*100+'%';$('st').textContent=S.streak;$('stn').textContent=S.streak_need;
$('dots').innerHTML=Array.from({length:S.streak_need},(_,i)=>'<i class="'+(i<S.streak?'on':'')+'"></i>').join('');
$('vip').hidden=!(S.vip_until&&new Date(S.vip_until)>new Date());$('left').textContent=S.left;
$('cnt').textContent='×'+total();$('open').classList.toggle('empty',total()==0);$('open').disabled=busy;$('buy').disabled=busy;
$('m5').disabled=busy||total()<5;$('m10').disabled=busy||total()<10;
$('feed').hidden=!S.feed.length;$('feed').innerHTML='<b>Недавние выигрыши</b>'+S.feed.map(f=>'<div>'+ic(f.code,22)+'<span>Игрок выиграл '+esc(f.name)+' · '+ago(f.ago)+'</span></div>').join('');crashUI()}
async function load(){S=await api('state');buildWheel();ui();if(S.streak_gift){S.streak_gift=false;confetti(40);show('<div class="big">🔥</div><div class="res">'+S.streak_need+' дней подряд!\n+1 бесплатный прокрут</div><button class="ok" onclick="closeM()">Отлично</button>')}}
$('m').onclick=e=>{if(e.target.id=='m')closeM()}
document.querySelectorAll('.tabs button[data-t]').forEach(b=>b.onclick=()=>{if(busy)return;tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));$('t-wheel').hidden=tab!='wheel';$('t-slots').hidden=tab!='slots';$('t-crash').hidden=tab!='crash';$('openbox').hidden=tab=='crash'});
function confetti(n){const col=['#8b6cff','#c9b9ff','#f2c14e','#ff7aa8','#4cc9a0'];for(let i=0;i<n;i++){const d=document.createElement('i');d.className='cf';d.style.left=Math.random()*94+'vw';d.style.background=col[i%5];d.style.animationDelay=Math.random()*.5+'s';d.style.animationDuration=1.6+Math.random()*1.2+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3400)}}
async function wheelAnim(res){const i=S.prizes.findIndex(p=>p.code==res.prize),w=360/S.prizes.length,j=(Math.random()-.5)*w*.6;
rot=rot-(rot%360)+360*6-(i+.5)*w+j;$('wh').classList.add('go');$('disc').style.transform='rotate('+rot+'deg)';await sleep(5500);$('wh').classList.remove('go')}
function reelRun(i,fin){const st=$('r'+i),n=16,H=96;let h='<div>'+ic(cur[i],58)+'</div>';for(let k=0;k<n;k++)h+='<div>'+ic(pick(S.prizes).code,58)+'</div>';h+='<div>'+ic(fin,58)+'</div>';
st.style.transition='none';st.style.transform='translateY(0)';st.innerHTML=h;st.offsetHeight;st.style.transition='transform '+(1.5+i*.5)+'s cubic-bezier(.15,.8,.2,1)';st.style.transform='translateY(-'+(n+1)*H+'px)';cur[i]=fin;return sleep(1600+i*500)}
async function slotAnim(res){const cs=S.prizes.map(p=>p.code);let s=[res.prize,res.prize,res.prize];
if(res.prize=='shard'){s=[pick(cs),pick(cs),pick(cs)];while(s[0]==s[1]&&s[1]==s[2])s[2]=pick(cs)}
$('slot').classList.remove('win');await Promise.all([0,1,2].map(i=>reelRun(i,s[i])));if(res.prize!='shard')$('slot').classList.add('win')}
async function done(res){busy=false;await load();tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success');if(res.prize!='shard')confetti(RARE.includes(res.prize)?90:30);show('<div class="big">'+ic(res.prize,88)+'</div><div class="res">'+esc(res.text)+'</div><button class="ok" onclick="closeM()">Отлично</button>')}
async function err(e){busy=false;$('wh').classList.remove('go');ui();show('<div class="res">'+esc(e.message||e)+'</div><button class="ok" onclick="closeM()">Закрыть</button>')}
$('open').onclick=async()=>{if(busy)return;if(total()==0)return shop();const kind=S.bonus>0?'free':S.left>0?'credit':null;
if(!kind)return show('<div class="res">Дневной лимит платных прокрутов исчерпан. Купленные прокруты сохранятся до завтра.</div><button class="ok" onclick="closeM()">Понятно</button>');
busy=true;ui();try{const r=await api(kind);if(!r||r.error)throw new Error(r&&r.error||'Ошибка');S.last_id=r.id;await(tab=='slots'?slotAnim(r):wheelAnim(r));await done(r)}catch(e){err(e)}};
async function multi(n){if(busy||total()<n)return;busy=true;ui();try{const r=await api('multi',{n});if(r.error)throw new Error(r.error);busy=false;await load();
const chips=r.results.map((c,i)=>{const p=S.prizes.find(x=>x.code==c);return '<span class="chip'+(RARE.includes(c)?' g':'')+'" style="animation-delay:'+i*.07+'s">'+ic(c,30)+'</span>'}).join('');
tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success');if(r.results.some(c=>RARE.includes(c)))confetti(90);else if(r.days)confetti(30);
show('<h3>Открыто '+r.results.length+'</h3><div class="chips">'+chips+'</div><div class="res">'+esc(r.text)+'</div><button class="ok" onclick="closeM()">Отлично</button>')}catch(e){err(e)}}
$('m5').onclick=()=>multi(5);$('m10').onclick=()=>multi(10);
function shop(){const one=S.packs[0];show('<h3>🛒 Купить прокруты</h3><div class="hint">Пакет остаётся на балансе, пока не потратишь. Лимит: '+S.limit+' платных прокрутов в день.</div><div class="grid">'+S.packs.map(p=>{const per=p.stars/p.n,off=Math.round((1-per/one.stars)*100);
return '<button class="pack'+(p.n==50?' best':'')+'" data-n="'+p.n+'">'+(off>0?'<em>−'+off+'%</em>':'')+'<b>'+p.n+'</b><small style="margin:-3px 0 6px">'+word(p.n)+'</small><span>'+p.stars+' ⭐</span><small>'+(per%1?per.toFixed(2):per)+' ⭐ за прокрут</small></button>'}).join('')+'</div>');
document.querySelectorAll('.pack').forEach(b=>b.onclick=()=>{closeM();pay(+b.dataset.n)})}
async function pay(n){if(busy)return;busy=true;ui();try{const r=await api('invoice',{pack:n});if(r.error)throw new Error(r.error);
tg.openInvoice(r.link,async st=>{if(st!=='paid'){busy=false;ui();return}
for(let k=0;k<15;k++){const l=await api('last',{after:S.last_id});if(l.found){S.last_id=l.id;busy=false;await load();confetti(35);return show('<div class="big">🎟</div><div class="res">'+esc(l.text)+'</div><button class="ok" onclick="closeM()">Отлично</button>')}await sleep(1000)}
busy=false;await load();show('<div class="res">Платёж прошёл, прокруты скоро появятся на балансе.</div><button class="ok" onclick="closeM()">Ок</button>')})}catch(e){err(e)}}
$('buy').onclick=()=>{if(!busy)shop()};
$('odds').onclick=()=>show('<h3>📊 Шансы за один прокрут</h3>'+S.prizes.map(p=>'<div class="row"><span>'+ic(p.code,24)+esc(p.name)+'</span><b>'+p.p+'%</b></div>').join('')+'<p class="hint" style="margin-top:12px">Колесо и слоты используют одни и те же шансы. В слотах три одинаковых символа означают приз, иначе выпадает осколок. 10 осколков = +3 дня. 7 дней подряд = +1 бесплатный прокрут. Друг в боте = +1 прокрут. Скидки действуют 2,5 часа. Мишку выдаёт администратор вручную. Самолёт: ставка 1-10 прокрутов, выигрыш = ставка × множитель × '+S.crash.shards_per+' осколка, в среднем игрокам возвращается около '+S.crash.rtp+'%, потолок ×'+S.crash.cap+'. Осколки из всех игр суммируются.</p><button class="ok" onclick="closeM()">Закрыть</button>')
function renderHist(){$('hist').innerHTML=hist.map(m=>'<span class="'+(m<2?'lo':m<5?'mid':'hi')+'">'+m.toFixed(2)+'×</span>').join('')}
function crashUI(){if(!S||!S.crash)return;$('bal').textContent=total();$('rtp').textContent=S.crash.rtp;const run=!!(R&&!R.done);
document.querySelectorAll('.bet').forEach(b=>{b.classList.toggle('on',+b.dataset.b==B);b.disabled=run||busy||total()<+b.dataset.b});
$('fly').disabled=busy||total()<B;$('flyt').textContent=total()<B?'Не хватает прокрутов':'Взлёт · ставка '+B}
document.querySelectorAll('.bet').forEach(b=>b.onclick=()=>{B=+b.dataset.b;crashUI()});
function drawCrash(t,m){const c=$('cv'),x=c.getContext('2d'),W=c.width,H=c.height,k=S.crash.k;x.clearRect(0,0,W,H);
const xm=Math.max(6,t*1.12),ym=Math.max(2,m*1.15),px=a=>30+a/xm*(W-70),py=v=>H-30-Math.log(v)/Math.log(ym)*(H-80);
x.strokeStyle='rgba(255,255,255,.06)';x.lineWidth=2;for(let i=1;i<5;i++){x.beginPath();x.moveTo(0,H*i/5);x.lineTo(W,H*i/5);x.stroke()}
x.beginPath();for(let i=0;i<=60;i++){const a=t*i/60,v=Math.exp(k*a);i?x.lineTo(px(a),py(v)):x.moveTo(px(a),py(v))}
const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#6a45ff');g.addColorStop(1,'#d6caff');x.lineWidth=8;x.lineCap='round';x.strokeStyle=g;x.shadowColor='#8b6cff';x.shadowBlur=20;x.stroke();x.shadowBlur=0;
x.lineTo(px(t),H);x.lineTo(px(0),H);x.closePath();const f=x.createLinearGradient(0,0,0,H);f.addColorStop(0,'rgba(139,108,255,.3)');f.addColorStop(1,'rgba(139,108,255,0)');x.fillStyle=f;x.fill();
const tp=Math.max(0,t-.2),ang=Math.atan2(py(m)-py(Math.exp(k*tp)),px(t)-px(tp))*180/Math.PI,p=$('plane');
p.style.left=px(t)/W*100+'%';p.style.top=py(m)/H*100+'%';p.style.transform='translate(-50%,-50%) rotate('+(t>0.05?ang:-30)+'deg)'}
function resetSky(){$('plane').innerHTML=ic('plane',46);$('mult').textContent='1.00×';$('mult').className='mult';drawCrash(0,1)}
function loop(){if(!R||R.done)return;const t=Math.max(0,(Date.now()-R.off-R.start)/1000),m=Math.exp(S.crash.k*t);
$('mult').textContent=(Math.floor(m*100)/100).toFixed(2)+'×';$('mult').className='mult'+(m>=5?' hi':'');
$('casht').textContent='Забрать · +'+Math.floor(R.bet*m*S.crash.shards_per)+' осколков';drawCrash(t,m);requestAnimationFrame(loop)}
function startRound(r){R={bet:r.bet,start:r.start_ms,off:Date.now()-r.now_ms,done:false,ac:new AbortController()};busy=true;$('fly').hidden=true;$('cash').hidden=false;crashUI();loop();
api('crash_wait',{},R.ac.signal).then(res=>finish(res)).catch(()=>{})}
async function finish(res){if(!R||R.done||(res.status!='crashed'&&res.status!='cashed'))return;R.done=true;try{R.ac.abort()}catch(e){}const win=res.status=='cashed';
$('mult').textContent=res.mult.toFixed(2)+'×';$('mult').className='mult '+(win?'win':'lose');
if(!win){const p=$('plane');p.style.transform='translate(-50%,-50%)';p.innerHTML=ic('boom',52)}
hist.unshift(res.mult);hist=hist.slice(0,8);renderHist();$('fly').hidden=false;$('cash').hidden=true;busy=false;await load();
if(win){tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success');confetti(res.days?90:40);
show('<div class="big">'+ic('shard',88)+'</div><div class="res">×'+res.mult.toFixed(2)+' → +'+res.shards+' осколков'+(res.days?'\nСобрано 10 осколков: +'+res.days+' дн. подписки':'')+'</div><button class="ok" onclick="closeM()">Отлично</button>')}}
$('fly').onclick=async()=>{if(busy)return;busy=true;crashUI();try{const r=await api('crash_start',{bet:B});
if(r.error){if(r.active){busy=false;return startRound(r.active)}throw new Error(r.error)}
let u=Math.min(S.bonus,B);S.bonus-=u;S.credits-=B-u;resetSky();
if(r.crashed){R={bet:B,done:false,ac:new AbortController()};return finish({status:'crashed',mult:1})}
startRound(r)}catch(e){err(e)}};
$('cash').onclick=async()=>{if(!R||R.done||R.busy)return;R.busy=true;try{finish(await api('crash_cash'))}catch(e){err(e)}if(R)R.busy=false};
let ok=false;try{ok=localStorage.getItem('age18')=='1'}catch(e){}
$('tt').innerHTML=ic('chip',26);$('shl').innerHTML=ic('shard',14)+' Осколки';$('stl').innerHTML=ic('flame',14)+' Серия дней';$('odds').innerHTML=ic('chart',22);
load().then(()=>{reelInit();resetSky();if(S.crash.active){document.querySelector('.tabs button[data-t=crash]').click();startRound(S.crash.active)}if(!ok)show('<div class="big" style="font-size:54px;font-weight:800;color:#f2c14e">18+</div><div class="res">Игровой раздел только для 18+.\nПризы действуют только внутри бота.</div><button class="ok" id="age">Мне есть 18</button>'),$('age').onclick=()=>{try{localStorage.setItem('age18','1')}catch(e){}closeM()}}).catch(err)
</script></body></html>
